<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2Learn — After-school lessons</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-ink: #1c1917;
      --color-muted: #78716c;
      --color-surface: #fafaf9;
      --color-line: #e7e5e4;
      --color-night: #1e1b4b;
      --color-indigo: #4338ca;
      --color-teal: #0d9488;
      --color-accent: #f97316;
      --font-display: "Fraunces", Georgia, serif;
      --font-sans: "Inter", system-ui, -apple-system, sans-serif;
    }
    @layer components {
      .bg-brand { background-image: linear-gradient(135deg, #1e1b4b 0%, #4338ca 55%, #0d9488 100%); }
      .text-brand { background-image: linear-gradient(90deg, #4338ca, #0d9488); -webkit-background-clip: text; background-clip: text; color: transparent; }
    }
  </style>
  <link rel="stylesheet" href="style.css?v=1">
  <script src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js"></script>
</head>
<body class="bg-surface font-sans text-ink antialiased">
  <div id="app" v-cloak>
    <nav-bar
      :sitename="sitename"
      :cart-count="cart.length"
      :can-open-cart="canOpenCart"
      :view="view"
      @toggle-cart="toggleCart"
    ></nav-bar>

    <header class="relative overflow-hidden bg-brand text-white">
      <div class="pointer-events-none absolute -top-24 -right-24 h-96 w-96 rounded-full bg-teal/40 blur-3xl"></div>
      <div class="pointer-events-none absolute -bottom-32 -left-20 h-96 w-96 rounded-full bg-accent/25 blur-3xl"></div>
      <div class="relative mx-auto max-w-6xl px-4 py-16 sm:py-24">
        <p class="mb-4 inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-sm font-medium ring-1 ring-white/20">
          <i class="fa fa-map-marker"></i> After-school lessons across North London
        </p>
        <h1 class="max-w-3xl font-display text-4xl font-semibold leading-tight sm:text-6xl">
          Plan your family's week in one sentence.
        </h1>
        <p class="mt-5 max-w-2xl text-lg text-white/80">
          Coding, art, football, music and more for ages 5 to 15. Book a space in seconds, with small groups and friendly teachers.
        </p>
        <div class="mt-8 flex flex-wrap gap-3">
          <a href="#lessons" class="rounded-full bg-white px-6 py-3 font-semibold text-night shadow-lg shadow-black/20 transition hover:-translate-y-0.5 hover:shadow-xl">
            Browse lessons <i class="fa fa-arrow-right ml-1"></i>
          </a>
        </div>
        <dl class="mt-12 grid max-w-xl grid-cols-3 gap-6 text-sm">
          <div><dt class="text-white/60">Weekly lessons</dt><dd class="font-display text-3xl font-semibold">{{ lessons.length || 16 }}</dd></div>
          <div><dt class="text-white/60">Venues</dt><dd class="font-display text-3xl font-semibold">8</dd></div>
          <div><dt class="text-white/60">Ages</dt><dd class="font-display text-3xl font-semibold">5–15</dd></div>
        </dl>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-10"></main>
  </div>

  <script type="module" src="app.js?v=1"></script>
</body>
</html>
