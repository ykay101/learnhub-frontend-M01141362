<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnHub - After School Lessons</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1><i class="fa fa-graduation-cap" aria-hidden="true"></i> {{ sitename }}</h1>
    </header>

    <main>
      <div class="controls">
        <div class="control">
          <label><i class="fa fa-sort" aria-hidden="true"></i> Sort by</label>
          <select v-model="sortAttribute">
            <option value="topic">Subject</option>
            <option value="location">Location</option>
            <option value="price">Price</option>
            <option value="space">Spaces</option>
          </select>
        </div>
        <div class="control">
          <label>Order</label>
          <div class="radios">
            <label><input type="radio" v-model="sortOrder" value="ascending"> Ascending</label>
            <label><input type="radio" v-model="sortOrder" value="descending"> Descending</label>
          </div>
        </div>
      </div>

      <div class="lesson-list">
        <div class="lesson" v-for="lesson in sortedLessons" v-bind:key="lesson._id">
          <img v-bind:src="imageAddress(lesson)" v-bind:alt="lesson.topic">
          <h2>{{ lesson.topic }}</h2>
          <p><i class="fa fa-map-marker" aria-hidden="true"></i> Location: {{ lesson.location }}</p>
          <p><i class="fa fa-gbp" aria-hidden="true"></i> Price: £{{ lesson.price }}</p>
          <p><i class="fa fa-users" aria-hidden="true"></i> Spaces: {{ lesson.space }}</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
